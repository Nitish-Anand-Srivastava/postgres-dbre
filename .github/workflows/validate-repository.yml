name: Validate repository

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Run repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository validator
        run: python tools/validation/validate_repo.py

      - name: Test generator synchronization
        run: python -m unittest discover -s tools/repo_builder -p "test_*.py"

      - name: Verify generated workflow files are current
        run: |
          python tools/build_repository.py
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
