name: Validate repository

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Run repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository validator
        run: python tools/validation/validate_repo.py

      - name: Verify generated workflow files are current
        run: |
          python tools/build_repository.py
          git diff --exit-code
